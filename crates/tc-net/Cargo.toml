[package]
name = "tc-net"
description = "Byte-stream terminal backends: Telnet (with option negotiation) and serial ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
socket2 = "0.6"
crossbeam-channel.workspace = true
serialport = { version = "4", default-features = false }
suppaftp = { version = "12", features = ["rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sha2 = "0.11"
hmac = "0.13"
ureq.workspace = true
zeroize = "1"
tc-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
