[package]
name = "tc-ssh"
description = "Native SSH client (russh): shell channels, auth, host keys, SFTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tc-core.workspace = true
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "time", "io-util", "fs", "process"] }
anyhow.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
md5 = "0.8"
zeroize = "1"
base64 = "0.23"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
rand_core = "0.10"

[target.'cfg(windows)'.dependencies]
pageant = "0.2"

[lints]
workspace = true

[dev-dependencies]
tc-devserver.workspace = true
tempfile.workspace = true
futures = "0.3"
