[package]
name = "tc-devserver"
description = "Local SSH test server for TermCraft development and integration tests (127.0.0.1 only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tc-devserver"
path = "src/main.rs"

[dependencies]
tc-pty.workspace = true
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "time", "io-util", "process"] }
anyhow.workspace = true
russh-sftp = "3"

# Test RDP server (IronRDP), used by tc-rdp's tests.
ironrdp-server = { version = "0.9", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
ironrdp-displaycontrol = { version = "0.4", optional = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"], optional = true }
x509-cert = { version = "0.3", default-features = false, features = ["std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
rdp = ["dep:ironrdp-server", "dep:async-trait", "dep:ironrdp-displaycontrol", "dep:rcgen", "dep:x509-cert", "dep:rustls"]

[lints]
workspace = true
