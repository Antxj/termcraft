[package]
name = "tc-ui"
description = "TermCraft desktop app (thin egui layer over the command registry)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "termcraft"
path = "src/main.rs"

[dependencies]
tc-core.workspace = true
tc-commands.workspace = true
tc-term.workspace = true
tc-pty.workspace = true
tc-update.workspace = true
tc-ssh.workspace = true
tc-vault.workspace = true
tc-net.workspace = true
tc-import.workspace = true
eframe.workspace = true
egui.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
egui-phosphor = "0.14"
rfd = "0.17"
zeroize = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true

[dev-dependencies]
tc-devserver.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile.workspace = true
