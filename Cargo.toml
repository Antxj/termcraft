[workspace]
resolver = "3"
members = [
    "crates/tc-core",
    "crates/tc-commands",
    "crates/tc-term",
    "crates/tc-pty",
    "crates/tc-import",
    "crates/tc-update",
    "crates/tc-cli",
    "crates/tc-mcp",
    "crates/tc-ssh",
    "crates/tc-devserver",
    "crates/tc-vault",
    "crates/tc-net",
    "crates/tc-servers",
    "crates/tc-rdp",
    "crates/tc-ui",
    "xtask",
]
default-members = ["crates/tc-ui"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Antxj/termcraft"
authors = ["TermCraft contributors"]

[workspace.dependencies]
# internal
tc-core = { path = "crates/tc-core" }
tc-commands = { path = "crates/tc-commands" }
tc-term = { path = "crates/tc-term" }
tc-pty = { path = "crates/tc-pty" }
tc-import = { path = "crates/tc-import" }
tc-update = { path = "crates/tc-update" }
tc-mcp = { path = "crates/tc-mcp" }
tc-ssh = { path = "crates/tc-ssh" }
tc-devserver = { path = "crates/tc-devserver" }
tc-vault = { path = "crates/tc-vault" }
tc-net = { path = "crates/tc-net" }
tc-servers = { path = "crates/tc-servers" }
tc-rdp = { path = "crates/tc-rdp" }

# external
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
vt100 = "0.16"
encoding_rs = "0.8"
oem_cp = "2.1"
regex = "1"
portable-pty = "0.9"
eframe = "0.36"
egui = "0.36"
ureq = "3"
semver = "1"
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
self-replace = "1"
tempfile = "3"
getrandom = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The Master Password KDF is far too slow unoptimized (tests, dev builds).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
